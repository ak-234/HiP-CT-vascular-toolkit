# Read the Docs: publish the repository's Markdown with MkDocs.
# The docs live beside the code, so tools/collect_docs.py gathers them into
# .docs_src/ before the build; mkdocs.yml builds from there.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    pre_build:
      - python tools/collect_docs.py

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - requirements: docs/requirements.txt
